<body>
  <div id="outer">
    <header><div id="header-container"><div id="head-inner"><h1>「君に、声でお節介が焼けたなら。」音声＆動画</h1>
      <p class="description">「君に、声でお節介が焼けたなら。」の文中で作成した音声＆動画です。</p></div></div>
    </header>
    <div id="content-wrapper">
      <main>
        <div id="inner">
          <h2>音声</h2>
          <p>入力音声（わしのこえ）</p>
          <p>「明日の関東地方の天気は、晴れ。所により、にわか雨でしょう。」</p>
          <audio controls src="./my_voice.wav"></audio>
          <p>音声クローンによる出力結果1</p>
          <p>「こんにちは、これは私の声で作られた音声です。」</p>
          <audio controls src="./mofuru_tts_sample1.wav"></audio>
          <p>音声クローンによる出力結果2</p>
          <p>「東京特許許可局。隣の客はよく柿食う客だ。坊主が上手にびょうぶに坊主の絵をかいた。バスガス爆発。」</p>
          <audio controls src="./mofuru_tts_sample2.wav"></audio>
      
          <h2>動画</h2>
          <p>ゲーム内で出力してみた動画1</p>
          <video controls width="250">
            <source src="./mofuru_tts_sample1.mp4" type="video/mp4" />
          </video>
          <p>ゲーム内で出力してみた動画2</p>
          <video controls width="250">
            <source src="./mofuru_tts_sample2.mp4" type="video/mp4" />
          </video>
        </div>
      </main>
